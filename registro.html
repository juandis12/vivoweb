<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso & Registro - VivoTV</title>
    
    <!-- PWA & Mobile Meta -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="VivoTV">
    <link rel="apple-touch-icon" href="pwa-icon-512.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#060912">
    
    <link rel="icon" type="image/svg+xml" href="./favicon.svg">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        function updateVH() {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        window.addEventListener('resize', updateVH);
        updateVH();

        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splashScreen');
                if (splash && getComputedStyle(splash).opacity !== '0') {
                    splash.style.transition = 'opacity 0.8s ease, visibility 0.8s';
                    splash.style.opacity = '0';
                    splash.style.visibility = 'hidden';
                    splash.style.pointerEvents = 'none';
                    setTimeout(() => splash.style.display = 'none', 1000);
                }
            }, 1200);
        });
    </script>
    <style>
        /* Better-Auth Enhancements (Cinematic Theme) */
        .auth-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
            gap: 4px;
        }
        .auth-tab-btn {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .auth-tab-btn.active {
            background: linear-gradient(135deg, rgba(187, 134, 252, 0.25), rgba(157, 78, 221, 0.35));
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(187, 134, 252, 0.2);
            border: 1px solid rgba(187, 134, 252, 0.4);
        }
        .auth-tab-btn:hover:not(.active) {
            color: #f1f5f9;
            background: rgba(255, 255, 255, 0.03);
        }
        .pass-strength-container {
            margin-top: 8px;
            display: none;
        }
        .pass-strength-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }
        .pass-strength-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s ease, background 0.3s ease;
        }
        .pass-strength-text {
            font-size: 0.75rem;
            color: #94a3b8;
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }
        .auth-remember-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            color: #94a3b8;
            margin: 12px 0 20px 0;
        }
        .auth-remember-label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .auth-remember-label input[type="checkbox"] {
            accent-color: #bb86fc;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .auth-forgot-link {
            color: #bb86fc;
            text-decoration: none;
            transition: color 0.2s;
        }
        .auth-forgot-link:hover {
            color: #e0aaff;
            text-decoration: underline;
        }
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.78rem;
            color: #64748b;
        }
        .security-badge svg {
            color: #10b981;
        }
    </style>
</head>
<body class="bg-mesh page-auth">
    <!-- Splash Screen animado -->
    <div id="splashScreen" class="splash-screen">
        <div class="splash-logo">VIVO<span>TV</span></div>
        <div class="splash-bars">
            <div></div><div></div><div></div><div></div><div></div>
        </div>
    </div>

    <main class="auth-container">
        <!-- Mesh Gradient Estilo Cinematic HBO / Disney -->
        <div class="mesh-gradient">
            <div class="mesh-circle circle-1"></div>
            <div class="mesh-circle circle-2"></div>
            <div class="mesh-circle circle-3"></div>
        </div>
        <div class="auth-overlay"></div>

        <div class="auth-card glass-panel">
            <div class="auth-logo"><a href="index.html" style="text-decoration:none; color:inherit;">VIVO<span>TV</span></a></div>
            
            <!-- Better-Auth Tab Switcher -->
            <div class="auth-tabs" role="tablist">
                <button type="button" class="auth-tab-btn" id="tabLogin" role="tab">Iniciar Sesión</button>
                <button type="button" class="auth-tab-btn active" id="tabRegister" role="tab">Crear Cuenta</button>
                <button type="button" class="auth-tab-btn" id="tabRecovery" role="tab" style="display:none;">Recuperar</button>
            </div>

            <h2 id="authTitle">Crea tu cuenta gratuita</h2>
            <p id="authSubtitle">Únete a la mejor experiencia de streaming en 4K Ultra HD</p>
            
            <form id="loginForm" novalidate autocomplete="on">
                <!-- Campo Username (Solo registro) -->
                <div class="input-group" id="groupUsername">
                    <label for="username">Nombre de Perfil</label>
                    <input type="text" id="username" placeholder="Ej: Cinéfilo12" autocomplete="username">
                </div>

                <!-- Campo Email -->
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="tu@correo.com" autocomplete="email">
                </div>

                <!-- Campo Contraseña -->
                <div class="input-group" id="groupPassword">
                    <label for="password">Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" required placeholder="Mínimo 8 caracteres" minlength="8" autocomplete="current-password">
                        <button type="button" class="btn-toggle-pass" id="btnTogglePass" aria-label="Mostrar u ocultar contraseña">
                            <svg id="eyeIcon" viewBox="0 0 24 24" width="18" fill="currentColor">
                                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                            </svg>
                        </button>
                    </div>
                    <!-- Better-Auth Password Strength Indicator -->
                    <div class="pass-strength-container" id="passStrengthContainer">
                        <div class="pass-strength-bar">
                            <div class="pass-strength-fill" id="passStrengthFill"></div>
                        </div>
                        <div class="pass-strength-text">
                            <span id="passStrengthLabel">Seguridad: Media</span>
                            <span id="passStrengthHint">Usa letras, números y símbolos</span>
                        </div>
                    </div>
                </div>

                <!-- Campo Confirmar Contraseña (Opcional en registro) -->
                <div class="input-group" id="groupConfirmPassword" style="display:none;">
                    <label for="confirmPassword">Confirmar Contraseña</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" placeholder="Repite la contraseña" minlength="8" autocomplete="new-password">
                    </div>
                </div>

                <!-- Opciones de Recordar y Olvido -->
                <div class="auth-remember-row" id="authOptionsRow">
                    <label class="auth-remember-label">
                        <input type="checkbox" id="chkRememberMe" checked>
                        <span>Recordar mi sesión</span>
                    </label>
                    <a href="#" class="auth-forgot-link" id="linkForgotPassword">¿Olvidaste tu contraseña?</a>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" id="btnSubmit">
                    <span id="btnText">Crear Cuenta</span>
                    <span class="loader hidden" id="btnLoader"></span>
                </button>
                
                <p id="authError" class="error-msg hidden" role="alert"></p>
                
                <div class="security-badge">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                        <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
                    </svg>
                    <span>Protección cifrada de sesión con Better-Auth & Supabase</span>
                </div>
            </form>
        </div>
    </main>

    <script type="module" src="./js/app.js?v=wp6"></script>
</body>
</html>
